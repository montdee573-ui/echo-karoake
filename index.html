<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo Karaoke Interface</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --panel-color: #1a1c29;
            --accent-color: #ff2a74;
            --text-main: #ffffff;
            --text-muted: #707593;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2a2d42;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .brand { font-size: 24px; font-weight: bold; color: var(--accent-color); }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.3);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
            text-align: center;
        }

        .stat-val { font-size: 20px; font-weight: bold; color: #00ffcc; }

        .lyrics-window {
            background: #05060b;
            border: 2px solid #2a2d42;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            font-size: 22px;
            line-height: 2;
            margin-bottom: 24px;
        }

        .lyric-past { color: var(--text-muted); font-size: 18px; }
        .lyric-current { color: var(--text-main); font-weight: bold; border-y: 2px solid var(--accent-color); padding: 5px 0; text-transform: uppercase; }
        .lyric-future { color: var(--text-muted); font-size: 18px; }

        .controls-panel {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
        }

        .control-group {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
        }

        .control-group label { width: 120px; color: var(--text-muted); }
        .control-group input { flex-grow: 1; accent-color: var(--accent-color); }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
        }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="brand">🎤 ECHO KARAOKE</div>
        <div class="room-info">Room Code: <strong style="color:#00ffcc;">X7B9</strong></div>
    </div>

    <div class="stats-bar">
        <div><div>SCORE</div><div class="stat-val" id="score">0,000</div></div>
        <div><div>MULTIPLIER</div><div class="stat-val" style="color:var(--accent-color);">x1</div></div>
        <div><div>STREAK</div><div class="stat-val" style="color:#ffcc00;">0</div></div>
    </div>

    <div class="lyrics-window">
        <div class="lyric-past">Is this the real life? Is this just fantasy?</div>
        <div class="lyric-current">► Caught in a landslide... ◄</div>
        <div class="lyric-future">No escape from reality...</div>
    </div>

    <div class="controls-panel">
        <h3>🎛️ Audio FX (Live Loopback)</h3>
        <div class="control-group">
            <label for="delay-time">Echo Delay</label>
            <input type="range" id="delay-time" min="0" max="1" step="0.05" value="0.3">
        </div>
        <div class="control-group">
            <label for="feedback-gain">Echo Feedback</label>
            <input type="range" id="feedback-gain" min="0" max="0.9" step="0.05" value="0.4">
        </div>
        <button class="btn" id="start-audio">Initialize App Environment</button>
    </div>
</div>

<script>
    let audioCtx;
    let micStream;
    let delayNode;
    let feedbackNode;

    document.getElementById('start-audio').addEventListener('click', async () => {
        if (!audioCtx) {
            try {
                // Initialize Web Audio API
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                // Request access to microphone
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                const source = audioCtx.createMediaStreamSource(micStream);
                
                // Build Echo Nodes
                delayNode = audioCtx.createDelay(1.0);
                delayNode.delayTime.value = parseFloat(document.getElementById('delay-time').value);
                
                feedbackNode = audioCtx.createGain();
                feedbackNode.gain.value = parseFloat(document.getElementById('feedback-gain').value);

                // Wire up routing layout: Mic -> Delay -> Feedback Loop -> Speakers
                source.connect(audioCtx.destination); // Dry vocal route
                source.connect(delayNode);
                delayNode.connect(feedbackNode);
                feedbackNode.connect(delayNode); // Feedback loop logic
                delayNode.connect(audioCtx.destination); // Wet vocal route

                document.getElementById('start-audio').innerText = "🔴 Mic Active With Echo Effect";
                document.getElementById('start-audio').style.backgroundColor = "#2de370";
                
                // Simulate Scoring Interface ticking
                setInterval(() => {
                    let scoreEl = document.getElementById('score');
                    let currentScore = parseInt(scoreEl.innerText.replace(/,/g, ''));
                    scoreEl.innerText = (currentScore + Math.floor(Math.random() * 15) + 5).toLocaleString();
                }, 300);

            } catch (err) {
                alert('Microphone initialization blocked or unsupported: ' + err);
            }
        }
    });

    // Real-time adjustments
    document.getElementById('delay-time').addEventListener('input', (e) => {
        if (delayNode) delayNode.delayTime.setValueAtTime(e.target.value, audioCtx.currentTime);
    });
    document.getElementById('feedback-gain').addEventListener('input', (e) => {
        if (feedbackNode) feedbackNode.gain.setValueAtTime(e.target.value, audioCtx.currentTime);
    });
</script>

</body>
</html>
